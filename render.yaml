# ==============================================================================
# MediScan AI — Render Blueprint Configuration
# Free-tier compatible multi-service deployment:
# 1. Web Service: FastAPI Backend (Python)
# 2. Static Site: React + Vite + TypeScript Frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: mediscan-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        # Update this value to match your exact deployed frontend URL on Render
        value: "https://mediscan-ai-frontend.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: mediscan-ai-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      # Single-Page Application (SPA) client-side routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Points to the deployed backend service URL on Render
        value: "https://mediscan-ai-backend.onrender.com"
